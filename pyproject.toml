[project]
name = "dml-original-optimized"
version = "0.1.0"
description = "Minimal source-aligned repair of an undergraduate DML simulation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.1",
  "xgboost>=2.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
